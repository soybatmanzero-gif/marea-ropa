{% extends "base.html" %}
{% block titulo %}Borrar producto{% endblock %}
{% block contenido %}
<div class="tarjeta separado" style="max-width:520px">
  <h2>¿Borrar “{{ producto.nombre }}”?</h2>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-peligro" type="submit">Sí, borrar</button>
    <a class="btn btn-contorno" href="{% url 'catalogo' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
